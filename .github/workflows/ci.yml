name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PGVERSION: "9.2"
  CKANVERSION: "2.7"

jobs:
  build:
    runs-on: ubuntu-22.04

    services:
      redis-server:
        image: redis
      postgresql:
        image: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - run: pip install --no-cache-dir git+https://github.com/ViderumGlobal/ckanext-spatial.git@ckan-2.7#egg=ckanext-spatial

      - run: pip install --no-cache-dir -r https://raw.githubusercontent.com/ckan/ckanext-spatial/master/pip-requirements.txt

      - run: bash bin/travis-build.bash

      - run: pip install flake8==3.5.0

      - run: sh bin/travis-run.sh

      - run: flake8 ./ckanext/nextgeossharvest --exclude ./ckanext/nextgeossharvest/harvesters/opensearch_example.py,./ckanext/nextgeossharvest/harvesters/cmems.py,./ckanext/nextgeossharvest/lib/cmems_base.py,./ckanext/nextgeossharvest/harvesters/gome2.py,./ckanext/nextgeossharvest/lib/gome2_base.py,./ckanext/nextgeossharvest/harvesters/itag.py --ignore E127,E128